  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --game-speed: 1; }
    
    body { background-color: #000000; color: #d1d5db; font-family: 'Georgia', 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', serif; }
    .font-mono { font-family: ui-monospace, Consolas, monospace; }
    
    .d-none { display: none !important; }
    
    @keyframes bobble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .anim-bobble { animation: bobble calc(2s / var(--game-speed)) infinite ease-in-out; }
    
    @keyframes damage {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      25% { transform: translateX(-10px); filter: brightness(2) grayscale(100%); }
      75% { transform: translateX(10px); filter: brightness(2) grayscale(100%); }
    }
    .anim-damage { animation: damage calc(0.3s / var(--game-speed)) ease-in-out; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #374151; }
    
    button { transition: background-color 0.2s, border-color 0.2s; border-radius: 0 !important; }
    .card-hover:hover { box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); border-color: #9ca3af; }
    
    .vn-char { transition: transform 0.3s, opacity 0.3s; transform: translateY(20px); opacity: 0; display: none; }
    .vn-char.active { transform: translateY(0); opacity: 1; display: flex; filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.9)); }
  </style>
</head>

class EventManager {
  constructor() {
    this.listeners = {};
    this.depth = 0;
    this.MAX_DEPTH = 15;
  }
  on(eventName, config) {
    if (!this.listeners[eventName]) this.listeners[eventName] = [];
    this.listeners[eventName] = this.listeners[eventName].filter(l => l.id !== config.id);
    this.listeners[eventName].push({ ...config, currentTriggers: 0 });
    this.listeners[eventName].sort((a, b) => (b.priority || 0) - (a.priority || 0));
  }
  emit(eventName, ctx) {
    if (this.depth > this.MAX_DEPTH) { console.warn(`Max depth at [${eventName}]`); return ctx; }
    this.depth++;
    const list = this.listeners[eventName] || [];
    for (let l of list) {
      if (l.maxTrigger > 0 && l.currentTriggers >= l.maxTrigger) continue;
      l.currentTriggers++;
      try { ctx = l.cb(ctx, this); } catch(e) { console.error(e); }
    }
    this.depth--;
    return ctx;
  }
  resetTurn() {
    for (let ev in this.listeners) this.listeners[ev].forEach(l => l.currentTriggers = 0);
  }
  removeAllByOwner(ownerId) {
    for (let ev in this.listeners) this.listeners[ev] = this.listeners[ev].filter(l => !l.id.includes(ownerId));
  }
}

let isAuto = false;
let gameSpeed = 1;

window.toggleAuto = function(e) {
  if (e) e.stopPropagation();
  isAuto = !isAuto;
  const btn = document.getElementById('btnAuto');
  btn.textContent = `AUTO: ${isAuto ? 'ON' : 'OFF'}`;
  btn.className = isAuto ? "text-green-400 hover:text-green-300 transition-colors cursor-pointer select-none" : "hover:text-white transition-colors cursor-pointer select-none text-gray-600";
  
  if (isAuto && !isEnemyTurn && currentEnemy && currentEnemy.hp > 0 && player.hp > 0 && !document.getElementById('battleMenu').classList.contains('d-none')) {
     processAutoAction();
  }
};

window.toggleSpeed = function(e) {
  if (e) e.stopPropagation();
  gameSpeed = gameSpeed === 1 ? 2 : (gameSpeed === 2 ? 3 : 1);
  document.documentElement.style.setProperty('--game-speed', gameSpeed);
  const btn = document.getElementById('btnSpeed');
  btn.textContent = `SPEED: x${gameSpeed}`;
  btn.className = gameSpeed > 1 ? "text-yellow-400 hover:text-yellow-300 transition-colors cursor-pointer select-none" : "hover:text-white transition-colors cursor-pointer select-none text-gray-600";
};

// 【追加】オート行動の処理関数
function processAutoAction() {
  if (!isAuto || isEnemyTurn || player.hp <= 0 || !currentEnemy || currentEnemy.hp <= 0) return;
  setTimeout(() => {
    if (isAuto && player.hp > 0 && currentEnemy && currentEnemy.hp > 0 && !isEnemyTurn) {
        executeAction('attack');
    }
  }, 400 / gameSpeed);
}

function startVN(stepId) {
  document.getElementById('rpg-mode').classList.add('d-none'); 
  document.getElementById('vn-mode').classList.remove('d-none'); 
  document.getElementById('vn-mode').classList.add('flex');
  GameState.currentDialogStep = stepId; 
  runDialogStep();
}

function runDialogStep() {
  const step = ScenarioData[GameState.currentDialogStep]; if (!step) return;
  document.querySelectorAll('.vn-char').forEach(el => el.classList.remove('active'));
  if (step.characters) step.characters.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('active'); });
  
  document.getElementById('vn-speaker').textContent = step.speaker || ""; 
  document.getElementById('vn-box').textContent = typeof step.text === 'function' ? step.text(GameState) : step.text;
  const choicesDiv = document.getElementById('vn-choices');
  choicesDiv.innerHTML = "";
  
  if (step.hasFreeTalk) {
    const d = document.createElement('div'); d.className = "flex gap-2 w-full mt-4 font-mono";
    const i = document.createElement('input'); i.placeholder = step.freeTalkPlaceholder; i.className = "flex-grow p-2 bg-black border border-gray-700 text-gray-300 outline-none focus:border-gray-400";
    const b = document.createElement('button'); b.textContent = step.freeTalkButtonText; b.className = "bg-black border border-gray-700 hover:bg-gray-900 text-gray-300 py-2 px-6 uppercase";
    const submit = () => { const nx = step.onFreeTalkSubmit(i.value.trim()); if(nx !== undefined){ GameState.currentDialogStep = nx; runDialogStep(); } };
    b.onclick = submit; i.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
    d.append(i, b); choicesDiv.appendChild(d); setTimeout(() => i.focus(), 10);
  } else if (step.choices) {
    step.choices.forEach(c => {
      const b = document.createElement('button'); b.textContent = c.text; b.className = "bg-black border border-gray-700 hover:bg-gray-800 text-gray-300 py-2 px-6 shadow-none mt-2 font-mono text-sm rounded-sm";
      b.onclick = () => { 
        let next = c.nextStep;
        if (c.onChoose) { const overrideNext = c.onChoose(); if(overrideNext !== undefined) next = overrideNext; }
        if (c.action) handleVNAction(c.action); 
        else if (next !== undefined) { GameState.currentDialogStep = next; runDialogStep(); }
      };
      choicesDiv.appendChild(b);
    });
  }
}

function handleVNAction(action) {
  document.getElementById('vn-mode').classList.add('d-none'); 
  document.getElementById('vn-mode').classList.remove('flex');
  document.getElementById('rpg-mode').classList.remove('d-none'); 
  document.getElementById('rpg-mode').classList.add('flex');
  
  if (action === 'startRPG') { 
    calcStats(); updateStatusUI(); returnToBase(); 
  } else if (action === 'enterDungeon') { 
    startDungeonExplore(); 
  }
}

const battle = {
  dealDamage(source, target, amount, tags = []) {
    if (!target || target.hp <= 0) return;
    
    let ctx = { source, target, damage: amount, tags, cancel: false, defenseOverride: null, useStatForDefense: 'def', actualDamage: 0 };
    ctx = em.emit('BeforeTakeDamage', ctx);
    if (ctx.cancel) return;
    
    let statKey = ctx.useStatForDefense || 'def';
    let defense = ctx.defenseOverride !== null ? ctx.defenseOverride : ((target.baseStats && target.baseStats[statKey]) || 0);
    let dmg = Math.max(1, Math.floor(ctx.damage - (defense / 2)));
    
    if (target.shield > 0) {
       if (target.shield >= dmg) {
          target.shield -= dmg;
          logMsg(`> 装甲が ${dmg} のダメージを吸収した。`, "text-cyan-500");
          dmg = 0;
       } else {
          dmg -= target.shield;
          target.shield = 0;
          logMsg(`> 装甲が破壊された。`, "text-cyan-600");
       }
    }
    
    ctx.actualDamage = dmg;
    
    if (dmg > 0) {
      target.hp -= dmg;
      logMsg(`> ${target.name} は ${dmg} のダメージを受けた。`, target.uid==='player' ? "text-red-500" : "text-gray-300");
      if(target.uid !== 'player') triggerDamageAnim();
    }
    
    em.emit('AfterTakeDamage', ctx);
    updateStatusUI();
    
    if (target.hp <= 0) {
       em.emit('OnDeath', { target, source });
    }
  },
  
  doHeal(source, target, amount) {
    if(!target || target.hp <= 0) return;
    let ctx = { source, target, healAmount: amount, cancel: false };
    ctx = em.emit('OnHeal', ctx);
    
    if (ctx.cancel || ctx.healAmount <= 0) return;
    target.hp = Math.min(target.maxHp, target.hp + ctx.healAmount);
    logMsg(`> ${target.name} は ${ctx.healAmount} HP回復した。`, 'text-green-500');
    updateStatusUI();
  },
  
  addShield(target, amount) {
    if(!target || target.hp <= 0) return;
    let ctx = { target, amount };
    ctx = em.emit('OnShieldGain', ctx);
    target.shield += ctx.amount;
    logMsg(`> ${target.name} は 装甲 ${ctx.amount} を得た。`, 'text-cyan-400');
    updateStatusUI();
  }
};

function generateDungeonMap() {
  let floorNodes = [];
  let idCount = 0;
  
  for(let i=0; i<=MAX_FLOOR; i++) {
    floorNodes[i] = [];
    let roomCount = (i === 0 || i === MAX_FLOOR) ? 1 : Math.floor(Math.random() * 2) + 2; 
    for(let j=0; j<roomCount; j++) {
       let typeKey = 'empty';
       if (i === MAX_FLOOR) typeKey = 'boss';
       else if (i === 0) typeKey = 'start';
       else {
           const r = Math.random();
           if (r < 0.45) typeKey = 'monster';
           else if (r < 0.55 && currentDungeon.rareEnemies) typeKey = 'elite';
           else if (r < 0.75) typeKey = 'event';
           else if (r < 0.85) typeKey = 'trap';
           else typeKey = 'rest';
       }
       let node = { id: idCount++, floor: i, type: typeKey, roomData: ROOM_TYPES[typeKey] || ROOM_TYPES['empty'], next: [] };
       floorNodes[i].push(node);
    }
  }
  
  for(let i=0; i<MAX_FLOOR; i++) {
    let currentLayer = floorNodes[i];
    let nextLayer = floorNodes[i+1];
    currentLayer.forEach((node, idx) => {
       let targetIdx = Math.min(idx, nextLayer.length - 1);
       node.next.push(nextLayer[targetIdx]);
       if (Math.random() < 0.6 && nextLayer.length > 1) {
          let secondTarget = (targetIdx + 1) % nextLayer.length;
          if (!node.next.includes(nextLayer[secondTarget])) node.next.push(nextLayer[secondTarget]);
       }
    });
  }
  return floorNodes[0][0]; 
}

function renderNextRooms() {
  const container = document.getElementById('mapTreeContainer');
  if(!container) return;
  
  container.style.pointerEvents = 'auto'; 
  
  container.innerHTML = '';
  
  if (!currentMapNode || currentMapNode.next.length === 0) return; 

  const nextNextNodes = new Set();
  currentMapNode.next.forEach(n => {
    n.next.forEach(nn => nextNextNodes.add(nn));
  });
  const nextNextArr = Array.from(nextNextNodes);

  if (nextNextArr.length > 0) {
    const topRow = document.createElement('div');
    topRow.className = "flex justify-center gap-4 w-full mb-8 relative z-10 opacity-50 pointer-events-none";
    nextNextArr.forEach(node => {
      const room = node.roomData;
      const div = document.createElement('div');
      div.className = "w-[60px] h-[80px] border border-gray-800 bg-[#050505] flex flex-col items-center justify-center p-1 rounded-sm";
      div.id = `node-preview-${node.id}`;
      div.innerHTML = `
        <div class="text-[1.5rem] grayscale">${room.icon}</div>
        <div class="text-[8px] text-gray-500 mt-1">${room.name}</div>
      `;
      topRow.appendChild(div);
    });
    container.appendChild(topRow);
  }

  const svgLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svgLayer.setAttribute("class", "absolute inset-0 w-full h-full z-0 pointer-events-none");
  container.appendChild(svgLayer);

  const bottomRow = document.createElement('div');
  bottomRow.className = "flex justify-center gap-3 w-full relative z-10";
  currentMapNode.next.forEach((nextNode, index) => {
    const room = nextNode.roomData;
    const btn = document.createElement('button');
    btn.className = "card-hover w-[90px] h-[120px] border border-gray-700 bg-black flex flex-col items-center justify-between p-2 rounded-sm";
    btn.id = `node-choice-${nextNode.id}`;
    btn.onclick = () => enterRoom(index);
    btn.innerHTML = `
      <div class="text-[8px] text-gray-500 w-full text-left truncate tracking-widest uppercase">${room.desc}</div>
      <div class="text-[2rem]">${room.icon}</div>
      <div class="text-[10px] text-gray-300 font-bold uppercase tracking-wider text-center w-full border-t border-gray-800 pt-1 mt-1 bg-black">${room.name}</div>
    `;
    bottomRow.appendChild(btn);
  });
  container.appendChild(bottomRow);

  requestAnimationFrame(() => {
    const containerRect = container.getBoundingClientRect();
    currentMapNode.next.forEach(nextNode => {
      const startEl = document.getElementById(`node-choice-${nextNode.id}`);
      if (!startEl) return;
      const startRect = startEl.getBoundingClientRect();
      const startX = startRect.left + startRect.width / 2 - containerRect.left;
      const startY = startRect.top - containerRect.top;

      nextNode.next.forEach(nextNextNode => {
        const endEl = document.getElementById(`node-preview-${nextNextNode.id}`);
        if (!endEl) return;
        const endRect = endEl.getBoundingClientRect();
        const endX = endRect.left + endRect.width / 2 - containerRect.left;
        const endY = endRect.bottom - containerRect.top;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", startX);
        line.setAttribute("y1", startY);
        line.setAttribute("x2", endX);
        line.setAttribute("y2", endY);
        line.setAttribute("stroke", "#374151");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("stroke-dasharray", "4 4");
        svgLayer.appendChild(line);
      });
    });
  });
}

function enterRoom(nextIndex) {
  const container = document.getElementById('mapTreeContainer');
  if (container) container.style.pointerEvents = 'none';

  if (!currentMapNode.next[nextIndex]) return;
  currentMapNode = currentMapNode.next[nextIndex];
  const room = currentMapNode.roomData;
  floorCount = currentMapNode.floor;
  updateStatusUI();

  if (room.id === 'boss') startBattle('boss');
  else if (room.id === 'monster') startBattle('normal');
  else if (room.id === 'elite') startBattle('rare');
  else if (room.id === 'event') startEvent();
  else if (room.id === 'rest') startRest();
  else if (room.id === 'trap') {
    const dmg = 10; player.hp = Math.max(1, player.hp - dmg);
    logMsg(`> 罠にかかった。${dmg} のダメージを受けた。`, "text-red-500"); updateStatusUI();
    setTimeout(showExploreMenu, 800 / gameSpeed); // 倍速適用
  }
  else {
    logMsg("> 空き部屋を通り抜けた。", "text-gray-600");
    setTimeout(showExploreMenu, 800 / gameSpeed); // 倍速適用
  }
}

function startBattle(type) {
  isEnemyTurn = false;
  switchMenu('battleMenu');
  const enemyInfo = document.getElementById('enemyInfo');
  if(enemyInfo) enemyInfo.classList.remove('d-none');
  
  const visualView = document.getElementById('visualView');
  
  if (type === 'boss') {
    currentEnemy = { 
      uid: 'enemy_boss', 
      name: currentDungeon.boss.name,
      sprite: currentDungeon.boss.sprite,
      hp: currentDungeon.boss.hp,
      maxHp: currentDungeon.boss.hp, 
      baseStats: { atk: currentDungeon.boss.atk, def: currentDungeon.boss.def },
      shield: 0,
      isBoss: true
    };
    if(visualView) visualView.className = "h-[45%] md:h-[55%] shrink-0 w-full border-b border-gray-800 relative overflow-hidden flex items-center justify-center transition-colors duration-500 " + currentDungeon.boss.bg;
    logMsg(`> ボス遭遇: ${currentEnemy.name}`, "text-red-700 font-bold tracking-widest");
  } else if (type === 'rare') {
    const template = currentDungeon.rareEnemies[Math.floor(Math.random() * currentDungeon.rareEnemies.length)];
    const multi = 1 + (floorCount * 0.1);
    currentEnemy = { 
      uid: `enemy_rare_${floorCount}`, name: template.name, sprite: template.sprite,
      hp: Math.floor(template.hp * multi), maxHp: Math.floor(template.hp * multi),
      baseStats: { atk: Math.floor(template.atk * multi), def: Math.floor(template.def * multi) }, shield: 0
    };
    if(visualView) visualView.className = "h-[45%] md:h-[55%] shrink-0 w-full border-b border-gray-800 relative overflow-hidden flex items-center justify-center transition-colors duration-500 " + template.bg;
    logMsg(`> 強敵遭遇: ${currentEnemy.name}`, "text-yellow-600 font-bold tracking-widest");
  } else {
    const template = currentDungeon.enemies[Math.floor(Math.random() * currentDungeon.enemies.length)];
    const multi = 1 + (floorCount * 0.1);
    currentEnemy = { 
      uid: `enemy_${floorCount}`, name: template.name, sprite: template.sprite,
      hp: Math.floor(template.hp * multi), maxHp: Math.floor(template.hp * multi),
      baseStats: { atk: Math.floor(template.atk * multi), def: Math.floor(template.def * multi) }, shield: 0
    };
    if(visualView) visualView.className = "h-[45%] md:h-[55%] shrink-0 w-full border-b border-gray-800 relative overflow-hidden flex items-center justify-center transition-colors duration-500 " + template.bg;
    logMsg(`> 敵遭遇: ${currentEnemy.name}`, "text-gray-400 tracking-widest");
  }

  const sprite = document.getElementById('enemySprite');
  if(sprite) {
    sprite.textContent = currentEnemy.sprite;
    if(!sprite.classList.contains('anim-bobble')) sprite.classList.add('anim-bobble');
  }
  
  const enemyName = document.getElementById('enemyName');
  if(enemyName) enemyName.textContent = currentEnemy.name;
  const enemyHpBar = document.getElementById('enemyHpBar');
  if(enemyHpBar) enemyHpBar.style.width = '100%';
  
  em.emit('OnBattleStart', { player, enemy: currentEnemy });
  em.resetTurn();
  em.emit('OnTurnStart', { entity: player });
  
  // 【追加】戦闘開始時にオートONなら自動行動開始
  if (isAuto) processAutoAction();
}

window.executeAction = function(type) {
  if (isEnemyTurn || player.hp <= 0 || !currentEnemy || currentEnemy.hp <= 0) return;
  
  if (type === 'attack') {
    let ctx = { source: player, target: currentEnemy, damage: player.baseStats.atk, tags: ['physical', 'melee'], cancel: false };
    ctx = em.emit('BeforeAttack', ctx);
    if (!ctx.cancel) {
      logMsg(`> ${player.name} の攻撃。`, "text-gray-300");
      battle.dealDamage(player, currentEnemy, ctx.damage, ctx.tags);
      em.emit('AfterAttack', ctx);
    }
  } else if (type === 'defend') {
    logMsg(`> ${player.name} は防御した。`, "text-gray-300");
    const amt = 15 + Math.floor(player.baseStats.def * 0.5);
    battle.addShield(player, amt);
  } else if (type === 'heal') {
    let ctx = { source: player, target: player, damage: player.baseStats.atk * 1.5, tags: ['magic', 'heal_spell'], cancel: false };
    ctx = em.emit('BeforeAttack', ctx);
    if (!ctx.cancel) {
      logMsg(`> ${player.name} は回復魔法を唱えた。`, "text-blue-300");
      battle.doHeal(player, player, Math.floor(ctx.damage));
    }
  } else if (type === 'flee') {
    if (currentEnemy.isBoss) { logMsg("> ボス戦からは逃げられない！", "text-red-700"); return; }
    if (Math.random() < 0.6) {
      logMsg("> 撤退に成功した。", "text-gray-500");
      setTimeout(() => returnToBase(), 1000 / gameSpeed); // 倍速適用
      return;
    } else { 
      logMsg("> 撤退に失敗した！", "text-red-700"); 
    }
  }
  
  finishPlayerTurn();
}

function finishPlayerTurn() {
  em.emit('OnTurnEnd', { entity: player });
  if (!currentEnemy || currentEnemy.hp <= 0) return;
  
  isEnemyTurn = true;
  setTimeout(enemyAction, 600 / gameSpeed); // 倍速適用
}

function enemyAction() {
  if (!currentEnemy || currentEnemy.hp <= 0) return;
  em.emit('OnTurnStart', { entity: currentEnemy });
  
  if (currentEnemy.hp > 0) {
    let dmg = currentEnemy.baseStats.atk + Math.floor(Math.random() * 5);
    let ctx = { source: currentEnemy, target: player, damage: dmg, tags: ['physical', 'melee'], cancel: false };
    ctx = em.emit('BeforeAttack', ctx);
    if (!ctx.cancel) {
      logMsg(`> ${currentEnemy.name} の攻撃。`, "text-gray-500");
      battle.dealDamage(currentEnemy, player, ctx.damage, ctx.tags);
      em.emit('AfterAttack', ctx);
    }
  }
  
  em.emit('OnTurnEnd', { entity: currentEnemy });
  isEnemyTurn = false;
  
  if (player.hp > 0) {
    em.resetTurn();
    em.emit('OnTurnStart', { entity: player });
    
    // 【追加】敵のターン終了時、オートONならプレイヤーの自動行動発動
    if (isAuto) processAutoAction();
  }
}

function onBattleWin() {
  const isBoss = (currentMapNode.type === 'boss');
  currentEnemy = null;
  player.hp = player.maxHp;
  player.shield = 0;
  updateStatusUI();
  logMsg("> 戦闘終了。HPが全回復した。", "text-green-600 tracking-widest");
  
  if (isBoss) {
    logMsg(`> ボスを撃破した！`, "text-gray-300 tracking-widest");
    if (GameState.targetDungeonId === GameState.clearedStages) GameState.clearedStages++;
    // 倍速適用
    setTimeout(() => { 
        if (GameState.clearedStages >= dungeons.length) { 
            startVN(800); 
        } else { 
            returnToBase(); 
        } 
    }, 2000 / gameSpeed);
  } else {
    setTimeout(showRewardScreen, 1000 / gameSpeed); // 倍速適用
  }
}

function startEvent() {
  switchMenu('eventMenu');
  const sprite = document.getElementById('enemySprite');
  if(sprite) sprite.textContent = "🧙‍♂️";
  logMsg("> 怪しい商人と遭遇した。", "text-purple-500 tracking-widest");
  
  const container = document.getElementById('eventOptions');
  if(!container) return;
  container.innerHTML = '';
  
  const b1 = document.createElement('button');
  b1.className = "bg-[#050505] border border-gray-700 hover:bg-[#111] p-3 text-gray-300 w-full uppercase text-xs";
  b1.innerText = "血を捧げる (最大HPを半減し、遺物を得る)";
  b1.onclick = () => {
    container.style.pointerEvents = 'none'; 
    const cost = Math.floor(player.maxHp * 0.5);
    player.maxHp = Math.max(1, player.maxHp - cost);
    player.hp = Math.min(player.hp, player.maxHp);
    logMsg(`> ${cost} の最大HPを犠牲にした。`, "text-red-500");
    updateStatusUI();
    showRewardScreen(); 
  };
  
  const b2 = document.createElement('button');
  b2.className = "bg-black border border-gray-800 hover:bg-[#111] p-3 text-gray-500 w-full uppercase text-xs";
  b2.innerText = "立ち去る";
  b2.onclick = () => {
    container.style.pointerEvents = 'none'; 
    logMsg("> その場を立ち去った。", "text-gray-500");
    showExploreMenu();
  };
  
  container.append(b1, b2);
}

function startRest() {
  switchMenu('eventMenu');
  const sprite = document.getElementById('enemySprite');
  if(sprite) sprite.textContent = "⛲";
  logMsg("> 静かな泉を見つけた。", "text-cyan-600 tracking-widest");
  
  const container = document.getElementById('eventOptions');
  if(!container) return;

// 【追加】前回のロックを解除する
  container.style.pointerEvents = 'auto';

  container.innerHTML = '';
  
  const b1 = document.createElement('button');
  b1.className = "bg-[#050505] border border-gray-700 hover:bg-[#111] p-3 text-gray-300 w-full uppercase text-xs";
  b1.innerText = "修行する (恒久的に攻撃力+5)";
  b1.onclick = () => {
    container.style.pointerEvents = 'none'; 
    player.baseStats.atk += 5;
    calcStats();
    logMsg("> 攻撃力が 5 上昇した。", "text-yellow-500");
    showExploreMenu();
  };
  
  container.append(b1);
}

function showRewardScreen() {
  switchMenu('rewardMenu');
  logMsg("> 遺物を一つ選べ。", "text-yellow-600 tracking-widest");
  
  const availableKeys = Object.keys(ArtifactDB).filter(k => !player.passives.find(p => p.id === k));
  availableKeys.sort(() => Math.random() - 0.5);
  const choices = availableKeys.slice(0, 3);
  
  const container = document.getElementById('rewardOptions');
  if(!container) return;

// 【追加】前回のロックを解除する
  container.style.pointerEvents = 'auto';
  
  container.innerHTML = '';
  
  if(choices.length === 0) {
     const btn = document.createElement('button');
     btn.className = "bg-black border border-gray-800 hover:bg-[#111] p-3 text-gray-500 w-full uppercase text-xs";
     btn.innerText = "進む (もう遺物はない)";
     btn.onclick = () => {
       container.style.pointerEvents = 'none'; 
       showExploreMenu();
     };
     container.appendChild(btn);
     return;
  }
  
  choices.forEach(k => {
     const art = ArtifactDB[k];
     const btn = document.createElement('button');
     btn.className = "bg-[#050505] border border-gray-700 hover:bg-gray-800 p-3 text-left w-full card-hover";
     btn.innerHTML = `<span class="text-xl mr-2">${art.icon}</span><span class="text-gray-200 font-bold uppercase text-xs tracking-widest">${art.name}</span><br><span class="text-[10px] text-gray-500 uppercase">${art.desc}</span>`;
     btn.onclick = () => {
        container.style.pointerEvents = 'none'; 
        
        logMsg(`> [${art.name}] を獲得した。`, "text-yellow-500");
        player.passives.push(art);
        rebuildPassives();
        showExploreMenu();
     };
     container.appendChild(btn);
  });
}

window.openStatusModal = function() {
  const modal = document.getElementById('statusModal');
  if(!modal) return;
  
  document.getElementById('modalMaxHp').textContent = player.maxHp;
  document.getElementById('modalAtk').textContent = player.baseStats.atk;
  document.getElementById('modalDef').textContent = player.baseStats.def;
  document.getElementById('modalSpd').textContent = player.baseStats.spd;
  
  const listContainer = document.getElementById('modalArtifactList');
  listContainer.innerHTML = '';
  
  if (player.passives.length === 0) {
    listContainer.innerHTML = '<div class="text-gray-600 text-xs">現在所持している遺物はありません。</div>';
  } else {
    player.passives.forEach(p => {
      const item = document.createElement('div');
      item.className = "bg-black border border-gray-800 p-2 flex gap-3 items-center";
      item.innerHTML = `
        <div class="text-2xl shrink-0">${p.icon}</div>
        <div class="flex flex-col">
          <div class="text-gray-200 text-xs font-bold tracking-widest">${p.name}</div>
          <div class="text-[10px] text-gray-500 mt-1 leading-tight">${p.desc}</div>
        </div>
      `;
      listContainer.appendChild(item);
    });
  }
  
  modal.classList.remove('d-none');
};

window.closeStatusModal = function() {
  const modal = document.getElementById('statusModal');
  if(modal) modal.classList.add('d-none');
};

window.onload = () => { 
  try {
    rebuildPassives();
    calcStats(); 
    logMsg("> SYSTEM ONLINE.", "text-gray-600");
    startVN(0); 
  } catch(e) {
    console.error("Boot error:", e);
  }
};
</script>
</body>
</html>
